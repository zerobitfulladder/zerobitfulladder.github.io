<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ title | default("Tuğrul Ağrikli") }}</title>
        <meta name="description" content="{{ description }}" />
        <meta name="author" content="Tuğrul Ağrikli" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="{{ title | default("Tuğrul Ağrikli") }}" />
        <meta property="og:description" content="{{ description }}" />
        <meta name="twitter:card" content="summary" />

        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23191724'/><text y='23' x='6' font-family='monospace' font-size='20' fill='%23c4a7e7'>t</text></svg>"
        />
        <link rel="stylesheet" href="/static/css/base.css" />

        <!-- KaTeX for LaTeX math rendering (vendored) -->
        <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
        <script defer src="/static/vendor/katex/katex.min.js"></script>
        <script
            defer
            src="/static/vendor/katex/auto-render.min.js"
            onload="
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                    ],
                })
            "
        ></script>

        <!-- Highlight.js for code syntax highlighting (vendored) -->
        <link rel="stylesheet" href="/static/vendor/highlight/rose-pine.min.css" />
        <script defer src="/static/vendor/highlight/highlight.min.js"></script>

        <!-- Starry background effect 
        <script type="module" src="/static/js/stars.js"></script>
         -->
    </head>
    <body>
        <nav class="main-nav">
            <h3><a href="/">Home</a></h3>
            <h3><a href="/experience.html">Work</a></h3>
            <h3><a href="/thought.html">Thoughts</a></h3>
            <h3><a href="/cv.html">CV</a></h3>
            <h3><a href="/music.html">Music</a></h3>
        </nav>
        <div class="page">
            <div class="content">{{ content }}</div>
        </div>

        <!-- Image Lightbox -->
        <div class="image-lightbox" id="lightbox">
            <img src="" alt="Enlarged image" />
        </div>

        <script>
            // Image lightbox functionality
            document.addEventListener('DOMContentLoaded', function() {
                hljs.highlightAll();

                const lightbox = document.getElementById('lightbox');
                const lightboxImg = lightbox.querySelector('img');
                
                // Get all images in articles
                const images = document.querySelectorAll('article img, .side-media-img, .paired-img');
                
                images.forEach(img => {
                    img.addEventListener('click', function() {
                        lightboxImg.src = this.src;
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    });
                });
                
                // Close lightbox on click
                lightbox.addEventListener('click', function() {
                    this.classList.remove('active');
                    document.body.style.overflow = '';
                });
                
                // Close on Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                        lightbox.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });
            });
        </script>
    </body>
</html>

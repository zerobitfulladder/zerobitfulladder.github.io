        <!-- Image Lightbox -->
        <div class="image-lightbox" id="lightbox">
            <img src="" alt="Enlarged image" />
        </div>

        <script>
            // Image lightbox functionality
            document.addEventListener('DOMContentLoaded', function() {
                hljs.highlightAll();

                const lightbox = document.getElementById('lightbox');
                const lightboxImg = lightbox.querySelector('img');
                
                // Get all images in articles
                const images = document.querySelectorAll('article img, .side-media-img, .paired-img');
                
                images.forEach(img => {
                    img.addEventListener('click', function() {
                        lightboxImg.src = this.src;
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    });
                });
                
                // Close lightbox on click
                lightbox.addEventListener('click', function() {
                    this.classList.remove('active');
                    document.body.style.overflow = '';
                });
                
                // Close on Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                        lightbox.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });
            });
        </script>
        <script>
            // Pre-rendered at build time; corrected here so a stale build
            // never shows the wrong age.
            (function () {
                var el = document.getElementById('hudAge');
                if (!el) return;
                var b = new Date(1998, 6, 1), n = new Date();
                var a = n.getFullYear() - b.getFullYear();
                if (n.getMonth() < 6 || (n.getMonth() === 6 && n.getDate() < 1)) a--;
                el.textContent = a;
            })();
        </script>

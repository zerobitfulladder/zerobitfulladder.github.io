<script type="application/json" id="site-data">{"root": [{"id": "me", "path": "me", "name": "ME", "ext": ".html", "src": "content/me.html", "html": "<figure class=\"scan portrait\">\n  <img class=\"docimg img-center\" src=\"/static/media/crt/profile.jpg\" alt=\"Tuğrul Ağrikli\" width=\"880\" height=\"855\" />\n  <figcaption class=\"cap\">PHOTOGRAPH · AĞRİKLİ,&nbsp;T.</figcaption>\n</figure>\n\n<div class=\"welcome\" data-wrap>I'm not sure whether I exist or not.\n\nI'm interested in learning machines, cognitive sciences and philosophy of mind and self.\n\nCurrently exploring approaches to AI and machine learning from its history, as a comparative study: scanning the literature and experimenting hands-on to see their results from my own perspective.\n\nWhat I've been reading, and notes on it: <a href=\"#library\">LIBRARY</a>.\nThe experiments, with their code and results: <a href=\"https://github.com/zerobitfulladder/Zenith\">ZENITH</a>.\n\nFeel free to browse, or click this button.</div>\n<button class=\"btn\" type=\"button\" data-crash>BUTTON</button>\n\n<div class=\"gap\"></div>\n\n\n<div class=\"gap\"></div>\n\n<div class=\"facts\">\n<div class=\"fr\"><span class=\"k\">WORKS</span><span class=\"r\" data-leader></span><span class=\"v\"><span data-count=\"work\">-</span></span></div>\n<div class=\"fr\"><span class=\"k\">THOUGHTS</span><span class=\"r\" data-leader></span><span class=\"v\"><span data-count=\"thoughts\">-</span></span></div>\n<div class=\"fr\"><span class=\"k\">ON FILE</span><span class=\"r\" data-leader></span><span class=\"v\"><span data-count=\"work\">-</span> ENTRIES</span></div>\n<div class=\"fr\"><span class=\"k\">STATUS</span><span class=\"r\" data-leader></span><span class=\"v\">AVAILABLE</span></div>\n</div>\n\n\n<div class=\"gap\"></div>\n\n<div class=\"links center\">\n  <a href=\"mailto:tagrikli@proton.me\">EMAIL</a>\n  <a href=\"https://github.com/zerobitfulladder\">GITHUB</a>\n  <a href=\"https://www.upwork.com/freelancers/~01b6222728cba6f1ac\">UPWORK</a>\n  <a href=\"https://open.spotify.com/user/tagrikli\">SPOTIFY</a>\n  <a href=\"https://letterboxd.com/tagrikli/\">LETTERBOXD</a>\n</div>", "v": "1.8 KB", "modified": "2026-10-06"}, {"id": "thoughts", "path": "thoughts", "name": "THOUGHTS", "src": "content/thoughts/", "children": [{"id": "analysis-by-synthesis", "path": "thoughts/analysis-by-synthesis", "name": "ANALYSIS BY SYNTHESIS?", "ext": ".md", "src": "content/thoughts/analysis-by-synthesis.md", "html": "<p>Today I've read the paper called <em><a href=\"https://doi.org/10.1016/j.tics.2006.05.002\">Vision as Bayesian inference: analysis by synthesis?</a></em>, from 2006, by Alan Yuille and Daniel Kersten.</p>\n<h2>I. Reading old papers</h2>\n<p>A cognitive science paper from 2006. As I read more old papers, I just get more and more interested in them at this point. It's not like reading an old novel (I guess, I'm not a novel reader), where you witness the storytelling of a writer of that time and, despite the change of contexts or norms, still find something familiar due to human nature. Here it is quite different, as if I'm reading the highly structured ideas of a very smart people, composing such novel ideas without knowing about the advancements of the years to come. This paper is <strong>6 years</strong> before AlexNet, for the god's sake.</p>\n<p>I had heard of Bayesian approaches to brain function before, tho I never left the shallow waters. This is the first paper I've actually read on the topic, and it left a strong impression.</p>\n<h2>II. What they argue</h2>\n<p>Their argument, as far as I follow it, goes like this. Vision is an inverse problem: the world generates the image, and the brain has to run that generation backwards, asking what could have caused the thing it received. Bayes gives the shape of the answer, but it needs two pieces to work: a <em>generative model</em> of how a cause produces an image, and a <em>prior</em> over which causes are likely in the first place. Analysis by synthesis is the <strong>mechanism</strong> for actually computing it. You don't invert the generative model directly, because you can't. You propose a cause, synthesize what it would have looked like, and compare that against the image you actually got.</p>\n<h2>III. The input is already a lossy projection</h2>\n<p>I've acquired a new way of thinking about perception with this paper. As they mention, the image that falls onto the retina is a higher dimensional <em>thing</em> projected onto a lower dimension in a <em>lossy</em> way, which wasn't something I had thought about before. When I was experimenting with different architectures, I only thought about the lossiness of the network, mainly whether it should lower the dimension or keep it the same. I never thought that the input would <em>already</em> be a lossy projection of the real thing, let alone that the network could be given the job of figuring out what was lost. So then the function of the network is not just to represent the input losslessly, but to expand its dimensions even further, toward modelling the actual thing.</p>\n<h2>IV. What it would feel like</h2>\n<p>The claim that analysis by synthesis is the mechanism of Bayesian inference is a fascinating idea. Input is never the whole thing, only a cue. Then the recognition task is taking that cue to propose causes, rendering them to find a fit, which makes me think that if such a thing would feel like anything, it would feel close to the feeling of <strong>trying to figure something out</strong>.</p>\n<h2>V. Then it is a search problem</h2>\n<p>If that is the mechanism, then the shape of the working is a search, and there is more than one way it could go.</p>\n<p>The plainest version is to propose every cause, score them all, and return the best one. A cheaper version is to keep several proposals alive at once, rank them, and stop early on the ones that are clearly losing. Or you could hill climb: hold some of the causes fixed, iterate the others, and keep going while the fit improves.</p>\n<p>The one I keep coming back to is that this could be an A* like search. The proposed causes define a state. The valid actions are changes to those causes that don't contradict what is already proposed, each one putting you in a different state. And the heuristic function is just the probabilities.</p>\n<p>Though A* wants an admissible heuristic, one that never overestimates what is left to pay, and I don't think perception has that luxury. Being too optimistic about the probability that remains only makes the search slow.</p>\n<p>But hear me out. I often don't find any answer at all, so the bare search isn't complete. Clearly I do not go over the whole state space. What actually happens is more like there being a low probability option that I never even <strong>thought of</strong>, which points towards something closer to a beam search.</p>\n<p>Either way, being too pessimistic prunes the right explanation and hands you a fast, confident, wrong answer, which sounds a lot like the kind of mistake perception actually makes in optical illusions.</p>\n<h2>VI. What could actually run it</h2>\n<p>All of these are expensive, and that is the part that bothers me, because whatever the brain is doing here, it does it fast.</p>\n<p>It could be a sequential search. It could be a parallel one that evaluates branches separately, which I find unlikely given how much the branching factor varies. It could be an approximation of a search using a tally like structure, the one I come back to at the end.</p>\n<p>Or, more elegantly, and here I am guessing, sparse representations. If the proposals are sparse enough, a superposition of several of them could be held at once without lengthening the dimension and without them interfering with each other. (I got this idea from HTM theory.) I've heard from somewhere that PFC proposes and the basal ganglia picks. So maybe the output of PFC is a superposition of sparse proposals, and instead of a fixed priority queue, the basal ganglia is the policy that picks one proposition out of that superposition to expand, to propose that idea, for generation to check against the evidence.</p>\n<p>And even tho the sparsity helps, as the proposal count goes up the interference gets more likely, and that is the thing that defines the beam width. Then the incompleteness I noticed above wouldn't be a design choice, it would fall out of how much the representation can carry at once. You can't consider the option you never thought of because it never fit.</p>\n<p>I'm not a knowledgable person in this area, so I need more reading and experimentation to test any of this. These are mainly ideas composed from things I've read here and there, without much structure.</p>\n<h2>VII. Symmetry</h2>\n<p>The model that I'm envisioning should generate well in order to discriminate well, and the other way around, in a fully symmetric way, where performance on one directly affects the other. This is the same thing I have been circling from the other end: one set of constraints serving both as a grammar for generating instances and as a classifier for recognizing them. When I look at architectures such as CNNs or ViTs, they discriminate quite well but can't generate at all, whereas diffusion models can generate but discriminate poorly, natively.</p>\n<p>So overall, I think this idea of forward and backward projection, of analysis by synthesis, fits my vision about the importance of the symmetry, and I think the paper already circles around it. The discriminative property proposing, the generative property verifying.</p>\n<hr>\n<h2>Pondering upon</h2>\n<p>While pondering on this idea, I recalled that in my own experiments discrimination and generation were always in tension. My intuition was that weights tuned for discrimination cannot generate well, and weights tuned for description cannot discriminate well.</p>\n<p>I think that tension is structural rather than incidental. A description good enough to regenerate the input has to keep position, because you cannot render a digit without knowing where it sits. A classifier wants position gone, because for the label it is noise. The description is <em>equivariant</em>, move the digit and the code moves with it, while the label has to be <em>invariant</em>, move the digit and the answer must not move. Both objectives are pulling on the same weights in opposite directions, and whichever loss reaches those weights is the one that wins. The usual escape is pooling, but pooling is a trick. The invariance doesn't come from anything the network learned about translation, it comes from discarding the position by construction. Without it, even MNIST digits at different positions produce quite different descriptions. So how are you going to discriminate that?</p>\n<p>What I want instead is a backbone that stays purely descriptive, trained only by a generative objective, with a layer above it that does the arbitrary part. But the interesting question is what that upper layer is actually doing, and I don't think it is inventing invariance out of nothing. It reads the position out of the description, explains it away, and what is left no longer varies with where the thing was. Only then does the genuinely arbitrary step happen, the one that says this identity is called \"7\". So it is closer to a factorization into identity and pose, with a trivial lookup on the end, than to a mapping learned from scratch.</p>\n<p>Stated that way I can also say when it would be working. If I can take the identity and the pose that layer separated, put the pose back, and re-render the original image, then nothing was destroyed and the descriptive system is still whole. If position is gone for good, I have just bolted a classifier onto a generator, and the symmetry I actually care about is broken.</p>\n<p>We were doing half of this already. In our experiments we ran a tally on top of the descriptions, and that tally was the Bayesian inference layer: features voting for what could have caused them, evidence accumulating on whichever cause explains the most. What we never had was the other direction, the synthesis, actually producing a candidate and checking it against the input. So the tally was doing the inference in one compiled shot, without the generative loop that would have justified it.</p>\n<p>Which leaves me where I started, to be honest. I suspect these two aspects cannot sit in a single layer of one homogeneous stack. They want to be different organs of a larger system that is Bayesian as a whole: something that describes, something that proposes, and the traffic between them being where recognition actually happens.</p>", "date": "2026-09-09", "reading": 8, "summary": "On a 2006 paper, and why recognition might feel like remembering.", "wonder": true, "v": "9.8 KB", "modified": "2026-09-09", "group": "Posts"}], "v": "1", "modified": "2026-10-03"}, {"id": "work", "path": "work", "name": "WORK", "src": "content/work/", "children": [{"id": "zenith", "path": "work/zenith", "name": "ZENITH: EXPLORING LEARNING ALGORITHMS", "ext": ".md", "src": "content/work/zenith.md", "html": "<p>Zenith is my own research log: an exploration of learning algorithms built around three questions. Can a system learn locally, one example at a time? Can it keep what it learned when new things arrive? And can it both recognise and generate from the same memory? Every experiment keeps its code, its numbers and a written reading, including the ideas that failed.</p>\n<p><img class=\"docimg img-center\" alt=\"The directions explored, and the techniques each one borrowed\" src=\"/static/media/zenith-explored.png\" width=\"1860\" height=\"2202\" /></p>\n<h3>Scale</h3>\n<ul>\n<li><strong>202 experiments in 13 directions</strong>, over about 32 experiment days between March and October 2026.</li>\n<li><strong>Outcomes:</strong> 96 worked, 50 failed, and the rest were mixed or exploratory.</li>\n<li><strong>Code and write-ups:</strong> about 100,000 lines of Python and more than 400 written reports.</li>\n<li><strong>Framing:</strong> the README sets every result against the existing work it echoes, so the notes read as findings on my own setups, not as general claims.</li>\n</ul>\n<h3>The recurring building block</h3>\n<p>Many of the experiments share one unit:\n- A layer is a set of stored patterns, called templates, each a unit-length vector.\n- Templates compete for every input, and only the winners move a little toward what they saw.\n- What an input is, what it looks like and what comes next are all read back out of the same templates.\n- There is no loss function, no backpropagation and no batches.</p>\n<p>Other experiments set the unit aside to test a different idea: networks made of angles trained with gradients, search over programs, or trees of splats. CNNs and linear models appear throughout as the baselines to beat.</p>\n<h3>Selected notes</h3>\n<ul>\n<li><strong>Counting.</strong> One wide layer of 5x5 patch templates, read by counting which templates won for which digit at each position:</li>\n<li>97.30% on MNIST with nothing fitted at all;</li>\n<li><strong>98.69 ± 0.09%</strong> with a linear map on the counts;</li>\n<li><strong>89.89 ± 0.17%</strong> on Fashion-MNIST, against 85.12% for logistic regression on pixels (three seeds).</li>\n</ul>\n<p>This is the n-tuple idea from 1959, and about where well-tuned classical methods sit; a small CNN reaches 99.08%. None of my stacked versions beat it.\n- <strong>Forgetting.</strong> When each class ends up owned by its own group of templates and only the winning group updates, learning digits 5 to 9 after 0 to 4 barely disturbed the old ones: 97.57% before, 95.26% after, where plain fine-tuning of a network forgets almost everything. This is the protection adaptive resonance theory and mixtures of experts are known for, and the only comparison run was plain fine-tuning.\n- <strong>Recognition as explanation.</strong> Each digit is explained as a tree of Gaussian splats, learned by counting and grown when the current explanation fails. It read 95.93% on MNIST on one seed, and the same model draws a digit from its label.\n- <strong>Control.</strong> A simulated drone chased a target in 100 of 100 episodes, with a slow learned outer loop over a fast reflex taken from an autopilot. Learning the policy from reward alone with my own rule failed completely (0% against the teacher's 94%), and the write-up traces why.\n- <strong>Feedback, a null result.</strong> A gain from feedback on the learning step, seen on one seed, did not replicate in a pre-registered test over eight seeds, and was reported as a null.\n- <strong>Speed.</strong> Porting an online learning rule to the GPU with CuPy made it 114x faster (10.5 s against about 20 minutes) with results matching the CPU version.</p>\n<p><img class=\"docimg img-center\" alt=\"Digits explained as trees of splats, from coarse to fine\" src=\"/static/media/zenith-splat-trees.png\" width=\"704\" height=\"463\" /></p>\n<p><img class=\"docimg img-center\" alt=\"Digits drawn from their labels by the same model\" src=\"/static/media/zenith-draw-from-label.png\" width=\"954\" height=\"313\" /></p>\n<h3>How I work on it</h3>\n<p>Experiments are short, usually a day. Predictions are written down before the run, standard baselines are kept in nearly every comparison, and the claims that matter get several seeds and paired tests. I often reach an idea from intuition first and find its name in the literature afterwards, so the repository includes a dated reading list of about 150 references. My <a href=\"#work/breadcrumbs\">Breadcrumbs</a> tool holds that reading.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Zenith\">github.com/zerobitfulladder/Zenith</a></li>\n<li><strong>Stack:</strong> Python, NumPy, CuPy (GPU), PyTorch (baselines and the angle networks), scikit-learn, matplotlib, Dear PyGui.</li>\n<li><strong>Status:</strong> ongoing.</li>\n</ul>", "date": "2026-09-29", "reading": 3, "summary": "A research log on learning that is local, online and does not forget. 202 experiments in 13 directions, each with its code, its numbers and a written reading, including the ideas that failed.", "tags": ["Machine Learning", "Research", "Continual Learning", "Computational Neuroscience", "Python", "NumPy", "CuPy", "PyTorch"], "v": "4.5 KB", "modified": "2026-09-29", "group": "Highlight", "bright": true}, {"id": "breadcrumbs", "path": "work/breadcrumbs", "name": "BREADCRUMBS", "ext": ".md", "src": "content/work/breadcrumbs.md", "html": "<p>A tool for studying a field rather than discovering one. It keeps papers, their references, my notes and highlights in a SQLite database on my own machine, and lays the library out on a time grid so I can see how the work developed. It is what the <a href=\"#library\">LIBRARY</a> on this site is exported from.</p>\n<video class=\"docimg img-center\" src=\"/static/media/breadcrumbs-trail.mp4\" autoplay loop muted playsinline></video>\n\n<p>Left alone, the grid lights one paper at a time: magenta lines run to the work it cites, cyan to the work that cites it. The 90-second tour below covers the grid, a paper and its author, the assistant (Bread) working on the library, then reading: highlighting, asking about a passage, and Bread marking the page itself.</p>\n<div class=\"yt\"><iframe src=\"https://www.youtube-nocookie.com/embed/z0K-n6V5vAs\" title=\"Breadcrumbs: a 90-second tour\" loading=\"lazy\" allow=\"encrypted-media; picture-in-picture; fullscreen\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe></div>\n\n<p><img class=\"docimg img-center\" alt=\"The grid\" src=\"/static/media/breadcrumbs-grid.png\" width=\"2560\" height=\"1440\" /></p>\n<h3>How it works</h3>\n<ul>\n<li><strong>Curation, not crawling.</strong> Papers are added one at a time, by me. Adding one records the identifiers of everything it cites but creates no other papers; when one of those is added later, the link appears on its own. The graph grows out of deliberate choices instead of spreading until it is unreadable.</li>\n<li><strong>The grid.</strong> Every paper on one screen, in fixed columns of N years (1 to 50). A card's column depends on its year alone, so nothing moves when a panel opens or a paper is selected. Empty intervals keep their column, so width measures elapsed time honestly. Because the timeline is the point, dates are treated as data to verify: the earliest plausible year wins, and duplicate versions of the same work are flagged.</li>\n<li><strong>Metadata from five sources at once.</strong> OpenAlex, Crossref, Semantic Scholar, Unpaywall and arXiv are queried in parallel, each streaming its answer separately with its own retry, behind per-host rate limits. Nothing is saved until I confirm.</li>\n<li><strong>PDFs and reading.</strong> Legal open-access copies are found automatically and checked to really be PDFs. Highlights are stored relative to the page so they survive re-downloads and any zoom level. Notes take Markdown and LaTeX.</li>\n<li><strong>An assistant with guardrails.</strong> The agent loop is custom rather than built on a framework: 27 tools, with the ones that write clearly flagged, and capabilities loaded on demand as short skill files. SQL access goes through a separate read-only database connection, which no clever query can talk its way past. The assistant can propose papers but never add them. It works with Anthropic, OpenAI, Gemini, DeepSeek or OpenRouter models, and API keys are never sent back to the browser.</li>\n<li><strong>A static export.</strong> The published copy is produced by the real API handlers from an allowlist of routes, so there is no second copy of the queries to drift, and private data (PDFs, settings, conversations) never leaves the machine.</li>\n</ul>\n<p><img class=\"docimg img-center\" alt=\"The reader\" src=\"/static/media/breadcrumbs-reader.png\" width=\"2560\" height=\"1440\" /></p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Breadcrumbs\">github.com/zerobitfulladder/Breadcrumbs</a></li>\n<li><strong>Size:</strong> about 23,000 lines (Python backend, React and TypeScript front end, SQL schema), built in about a week in September 2026.</li>\n<li><strong>Stack:</strong> Python 3.14, FastAPI, SQLite (FTS5, WAL), httpx, PyMuPDF; React 19, TypeScript, Vite, react-pdf, KaTeX, Leaflet.</li>\n<li><strong>Status:</strong> built for my own use and still changing; migrations are written for my library rather than anyone else's.</li>\n</ul>", "date": "2026-09-10", "reading": 3, "summary": "A local tool for studying a body of literature. Papers, references, notes and highlights in a SQLite library on your own machine, laid out on a time grid so you can see how a field developed, with a research assistant that can read the library but never write behind your back.", "tags": ["Python", "FastAPI", "SQLite", "React", "TypeScript", "LLM Agents", "Research Tooling"], "v": "3.9 KB", "modified": "2026-09-10", "group": "Highlight", "bright": true}, {"id": "axonforge", "path": "work/axonforge", "name": "AXONFORGE", "ext": ".md", "src": "content/work/axonforge.md", "html": "<p>Most dataflow tools force you into a directed acyclic graph, and most simulators lock you into one model family. I needed neither restriction for my research on learning rules, where feedback and recurrence are the point, and where watching weights organise while a system runs tells you more than a final number. So before starting the research, I built the tool for it.</p>\n<video class=\"docimg img-center\" src=\"/static/media/axonforge.mp4\" autoplay loop muted playsinline controls></video>\n\n<h3>How it works</h3>\n<ul>\n<li><strong>Feedback-native execution.</strong> Graphs are scheduled by a topological sort that understands cycles: a recurrent connection delivers the previous step's value automatically. No delay nodes, no manual buffering, no rewriting the graph to make it acyclic.</li>\n<li><strong>Declarative nodes.</strong> A node is a Python class whose ports, parameters, displays and state are class attributes. Sliders, toggles, enums, file pickers, heatmaps and plots render inside the node itself, so a graph is its own instrumentation.</li>\n<li><strong>Hot reload.</strong> Edit a node's source and reload: field values are kept, the code is swapped, nothing restarts. Heavy initialisation runs in a separate process and ships its state back.</li>\n<li><strong>Project-local.</strong> Each research project keeps its own nodes, graphs and data. Graphs are saved as JSON with arrays stored beside them, so a project can be moved and versioned independently of the tool.</li>\n<li><strong>A command-line side.</strong> <code>axonforge init</code> scaffolds a project, <code>validate-node</code> checks a node headlessly, and the node-authoring guide is written so that an AI coding agent can follow it too.</li>\n<li><strong>A built-in library</strong> of math, linear algebra, statistics and information-theory nodes, noise generators, and inputs such as MNIST, moving shapes and small self-playing games.</li>\n</ul>\n<h3>History</h3>\n<p>It began on 25 February 2026 as MiniCortex, a web node editor (FastAPI plus plain JavaScript). It moved to a PySide6 desktop application a week later, became AxonForge in March, and was the substrate for the first month of my <a href=\"#work/zenith\">Zenith</a> research.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/AxonForge\">github.com/zerobitfulladder/AxonForge</a></li>\n<li><strong>Size:</strong> about 17,000 lines of Python.</li>\n<li><strong>Stack:</strong> Python 3.12, PySide6 (Qt), NumPy, Pillow; FastAPI and JavaScript in the first version.</li>\n<li><strong>Status:</strong> experimental, and dormant since March 2026. Graph formats and node interfaces changed between commits.</li>\n</ul>", "date": "2026-03-20", "reading": 2, "summary": "A node-based framework for algorithms that evolve over time. Nodes are plain Python classes, graphs may contain cycles, execution ticks one step at a time, and nodes hot-reload without restarting anything.", "tags": ["Python", "PySide6", "Framework", "Dataflow", "Hot Reload", "Computational Neuroscience"], "v": "2.7 KB", "modified": "2026-03-20", "group": "Highlight", "bright": true}, {"id": "oossolver", "path": "work/oossolver", "name": "OOSSOLVER: AUTOMATED CAR-PARK PLANNER", "ext": ".md", "src": "content/work/oossolver.md", "html": "<p>An automated car park takes a car at the door, puts it on a pallet and stores it in racks of shelves, out of reach. When the owner comes back, the system has to bring that exact car to a door, even if other cars are stacked in front of it. OOSSolver is the planner that decides every move: which carrier goes where, where each blocking car is set aside, and in what order, so that every car in the building always stays retrievable.</p>\n<p>I built it for Parkolay, a Turkish manufacturer of automated car parks, between May and August 2026. It has since been integrated into the company's control software, and automatic planning has been running at a live five-lift car park since September 2026.</p>\n<video class=\"docimg img-center\" src=\"/static/media/oossolver-demo.mp4\" autoplay loop muted playsinline controls></video>\n\n<p>The visualiser running the largest layout on its own at 16x speed: five lifts on the left, five shuttles below them, cars arriving and being asked for, and the solver planning every move.</p>\n<p><img class=\"docimg img-center\" alt=\"30 simulated days, no stuck day\" src=\"/static/media/oossolver-month.png\" width=\"1600\" height=\"896\" /></p>\n<h3>The problem</h3>\n<p>A facility is a network of <strong>lifts</strong> and <strong>shuttles</strong> that move pallets between <strong>LIFO shelves</strong> and the <strong>rooms</strong> where customers drop off and collect their cars. A carrier holds one pallet at a time and can only pass it to another carrier at fixed handoff points. SUVs fit only on SUV shelves. Empty pallets are interchangeable, and the number of pallets never changes.</p>\n<p>Getting one car out means digging. The pallets above it have to go somewhere, and every place they can go might bury another car, or take the last free slot that a different request needed. This is the block relocation problem, which is NP-hard before you add several carriers working at once, customers arriving while digs are under way, and the rule that no plan may ever leave the building in a state where some car can't be reached.</p>\n<h3>How it works</h3>\n<p>The solver has four layers, each with one job:</p>\n<ol>\n<li><strong>A solvability oracle</strong> answers \"would every car still be retrievable?\" exactly, by counting free slots and blockers instead of searching. It is cheap enough to ask before every decision, including whether to accept an arriving SUV at all.</li>\n<li><strong>A retrieval planner</strong> builds one candidate plan greedily, runs it inside a private copy of the simulation, and keeps it only if the end state passes the oracle. A plan is constructed and then checked; there is no open-ended search.</li>\n<li><strong>A dispatcher</strong> holds reservations on carriers, shelves and free slots, so plans running at the same time never collide. Admission gates and watchdogs keep the queue moving.</li>\n<li><strong>An executor</strong> compiles each pallet move into GOTO, TAKE and GIVE scripts for the individual carriers.</li>\n</ol>\n<p>Underneath is a discrete-event simulator with real motion profiles, a small language for describing facilities (ten layouts, from a single lift up to five lifts and five shuttles with 420 slots), and a visualiser for watching and poking at a live run.</p>\n<h3>How it got there</h3>\n<p>The deterministic design came last, after measuring the alternatives:</p>\n<ul>\n<li><strong>A single-lift planner</strong> (April to May) used A* search with admissible bounds. A C++20 port ran the same search 24.7x faster with bit-identical results over 106 tasks, but the largest layouts still timed out.</li>\n<li><strong>Reinforcement learning</strong> (May to June): PPO with a graph-attention policy, tree search at decision time, curricula and reward shaping. It learned to recover reliably, but plateaued at 0.43 to 0.57 on room staging against a 0.90 bar, so I dropped it.</li>\n<li><strong>An exact relocation core</strong> matched an exhaustive brute-force solver on 2,500 random instances, with zero disagreements and zero illegal plans.</li>\n<li><strong>The final solver</strong> replaced the learning stack entirely and passed every gate of its acceptance battery.</li>\n</ul>\n<h3>Results</h3>\n<p>Every run uses deterministic seeds, so each number below reproduces exactly.</p>\n<ul>\n<li><strong>Acceptance battery, 7 of 7 gates:</strong> digging out the most deeply buried car on a completely full layout, the deepest SUV at 85% full, fill-then-dig, a mass drain of 164 simultaneous requests, a full simulated day, seven consecutive days without a reset, and a sweep over all ten layouts.</li>\n<li><strong>30 simulated days</strong> of commuter traffic on the largest layout: 10,814 cars stored, 10,858 delivered, zero stuck days, and every car out by the end of the month.</li>\n<li><strong>Service time</strong> depends on how deep the car is buried, not on how full the park is.</li>\n<li><strong>Throughput</strong> reaches about 105 cars per hour when 164 requests arrive at once, or 152 per hour without customer dwell time.</li>\n<li><strong>Staging prefetch</strong>, fetching an empty pallet while the customer is still parking, cut store-and-restage time by 28%.</li>\n</ul>\n<p><img class=\"docimg img-center\" alt=\"Retrieval time by burial depth\" src=\"/static/media/oossolver-latency-depth.png\" width=\"1600\" height=\"896\" /></p>\n<p><img class=\"docimg img-center\" alt=\"Throughput under concurrent requests\" src=\"/static/media/oossolver-concurrency.png\" width=\"1600\" height=\"896\" /></p>\n<p>The month-long runs also found two deep defects that short tests never reach: a starvation loop, where unservable SUV requests locked out the clean-up that would have made room for them, and a three-way deadlock, where concurrent plans reserved almost every free slot between them. Both were traced to their root cause on deterministic replays, fixed, and covered by regression tests.</p>\n<h3>In production</h3>\n<p>To run the solver against real equipment, I wrote <strong>Planner2</strong>, an adapter inside the company's new control software. It translates the company's facility model and the live PLC snapshot into the solver's world, tells \"no data\" apart from \"known to be down\", rebuilds the topology when a lane or lift is out of service, and turns plans into field commands. It ships with 120 tests, and building it surfaced two real configuration faults that the company's own validator had missed.</p>\n<p>The company took over the code in September 2026 and switched on automatic planning at a live five-lift car park.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Role:</strong> sole author, for Parkolay, May to August 2026.</li>\n<li><strong>Stack:</strong> Python 3.12, DearPyGui, pytest, matplotlib. Earlier stages used PyTorch and PyTorch Geometric (RL), C++20 (the single-lift port) and OR-Tools CP-SAT.</li>\n<li><strong>Size:</strong> about 17,000 lines of Python, 72 tests, and about 3,900 lines of design documentation.</li>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/OOSSolver\">github.com/zerobitfulladder/OOSSolver</a></li>\n</ul>", "date": "2026-08-30", "reading": 5, "summary": "A simulator and deterministic planner for automated car parks. It plans every lift and shuttle move, checks each plan is safe before committing to it, and now drives automatic planning at a live five-lift car park.", "tags": ["Python", "Planning", "Simulation", "Operations Research", "Industrial Automation"], "v": "6.5 KB", "modified": "2026-08-30", "group": "Highlight", "bright": true}, {"id": "vision-based-edge-occupancy", "path": "work/vision-based-edge-occupancy", "name": "VISION-BASED EDGE OCCUPANCY DETECTION", "ext": ".md", "src": "content/work/vision-based-edge-occupancy.md", "html": "<p>My graduation project at Sabancı University, built on a real problem with real data from Parkolay's automated car parks.</p>\n<p>In an automated car park, a car that overhangs the edge of its pallet can hit the structure when the pallet moves. Today that check is done by laser scanners at the pallet edges. They cost €2,000 to 5,000 each, a pallet has four edges, and they fail on dark paint, which absorbs the beam. The question was whether cheap cameras and a small neural network could do the same job reliably.</p>\n<p><img class=\"docimg img-left\" alt=\"Empty pallet\" src=\"/static/media/edge-occ-empty.png\" width=\"922\" height=\"519\" />\n<img class=\"docimg img-right\" alt=\"Occupied pallet\" src=\"/static/media/edge-occ-full.png\" width=\"944\" height=\"531\" /></p>\n<h3>Data and labelling</h3>\n<ul>\n<li><strong>Collection:</strong> two Raspberry Pi 4 units, each with two 12 MP Camera Module 3 sensors, recorded at an operating car park for four weeks. That gave about 80,000 raw images, of which 20,000 from one camera position were used for development.</li>\n<li><strong>Labelling:</strong> doing 20,000 images by hand was estimated at more than 200 hours. Instead I labelled 1,000 by hand, trained a ResNet34 to pre-label the rest, and reviewed its calls in a fast keyboard-driven tool. The whole review took about 2 hours. The tool later grew into a multi-user web app (Flask and React), which is <a href=\"https://github.com/zerobitfulladder/Configurable-Manual-Image-Classification-Web-App\">open source</a>.</li>\n<li><strong>Evaluation:</strong> while testing, I found that a common occlusion augmentation produced artefacts that made the model look better than it was, and rebuilt the robustness tests around more realistic perturbations.</li>\n</ul>\n<h3>Model</h3>\n<p>MobileNetV3-Small, pre-trained on ImageNet and fine-tuned in PyTorch. It was chosen to fit the budget of a Raspberry Pi 5 or Jetson Nano: under 100 ms per frame, no special cooling, no expensive compute per pallet. Grad-CAM maps were used to inspect what the model attends to.</p>\n<h3>Synthetic data</h3>\n<p>Empty pallets all look alike, and one site offers little variety, so I built a procedural Blender pipeline that renders pallets with varied cars, lighting and materials: 4,000 labelled images in about two hours of rendering.</p>\n<p><img class=\"docimg img-left\" alt=\"Synthetic empty pallet\" src=\"/static/media/edge-occ-empty-syn.png\" width=\"744\" height=\"60\" />\n<img class=\"docimg img-right\" alt=\"Synthetic occupied pallet\" src=\"/static/media/edge-occ-full-syn.png\" width=\"744\" height=\"60\" /></p>\n<h3>Results</h3>\n<ul>\n<li><strong>98.94% validation accuracy</strong> on real data (59 errors in 5,547 images), with 99.61% precision, 98.13% recall on occupied edges, and an AUC of 0.999.</li>\n<li><strong>92.19% on a harder augmented test set</strong>, still with 96.18% recall on occupied edges.</li>\n<li><strong>Synthetic pre-training</strong> raised augmented accuracy to 94.30% and cut false alarms from 333 to 73, but lowered recall on occupied edges from 96.18% to 90.73%. In a safety system a missed car costs more than a false alarm, so that is a trade-off to choose deliberately, not a free win.</li>\n<li><strong>Cost:</strong> an estimated 96% lower hardware cost than laser scanners, and paint colour stops mattering.</li>\n</ul>\n<h3>Status</h3>\n<p>The data pipeline and model are complete. The real-time multi-camera service (a Raspberry Pi 5 with an AI accelerator, or a Jetson Nano, under 100 ms per frame) was designed but still in progress when the project ended. The full write-up, with methodology and error analysis, is in the <a href=\"/static/media/edge-occ-report.pdf\">final report</a>.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Role:</strong> solo graduation project (ENS 492), Sabancı University, 2025 to 2026. Problem and data from Parkolay.</li>\n<li><strong>Stack:</strong> Python, PyTorch, torchvision, OpenCV, Blender (Eevee and bpy), Flask, React, Raspberry Pi.</li>\n</ul>", "date": "2026-01-04", "reading": 2, "summary": "Cameras and a small neural network instead of the laser scanners that check whether a car overhangs its pallet in an automated car park. MobileNetV3 trained on real and Blender-rendered images, 98.94% validation accuracy, labelling cut from 200 hours to 2.", "tags": ["Computer Vision", "Deep Learning", "PyTorch", "MobileNetV3", "Synthetic Data", "Blender", "Raspberry Pi"], "v": "3.8 KB", "modified": "2026-01-04", "group": "Highlight", "bright": true}, {"id": "eileen", "path": "work/eileen", "name": "EILEEN: AN AI STREAMER WITH AN INNER LIFE", "ext": ".md", "src": "content/work/eileen.md", "html": "<p>Eileen is an AI streamer who talks with her chat live. She has a voice, a 3D body and a face, and underneath them an inner life that is tracked, not improvised: her feelings are numbers that rise and fade by fixed rules, and every change can be traced to the rule that caused it. She also has a secret. She is an AI who can't accept that she is one.</p>\n<div class=\"yt\"><iframe src=\"https://www.youtube-nocookie.com/embed/xJvnZel_tLc\" title=\"Eileen: the full demo\" loading=\"lazy\" allow=\"encrypted-media; picture-in-picture; fullscreen\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe></div>\n\n<h3>How it works</h3>\n<pre><code>chat -&gt; appraiser (LLM) -&gt; mind (code) -&gt; actor (LLM) -&gt; voice (TTS) -&gt; body (Godot)\n</code></pre>\n<ol>\n<li><strong>The appraiser</strong>, an LLM that knows her private core, reads each chat message and answers fixed questions about it: is it a reminder of what she is, how is it framed, is it good or bad for her goals, what did the sender do by her standards, which of her tastes does it touch. It never says what she feels.</li>\n<li><strong>The mind</strong> is plain code. It turns those answers into feelings with fixed rules: emotions with a fast spike and a slow tail, each with a source; a mood; drives such as boredom and loneliness; how she feels about each person in chat; hopes and dreads. It also picks how she copes, on a ladder from composed to strained, overwhelmed, and finally the crack.</li>\n<li><strong>The actor</strong>, a second LLM, writes her line from a short note about how she is behaving right now. It is never told what she feels, wants or why.</li>\n<li><strong>The voice and body.</strong> Chatterbox Turbo speaks the line, a phoneme recogniser drives her lip sync, and a Godot body plays what she actually feels through her face, gaze, blinks and breathing, including the feelings that leak through the faces she puts on.</li>\n</ol>\n<video class=\"docimg img-center\" src=\"/static/media/eileen-loop.mp4\" autoplay loop muted playsinline></video>\n\n<h3>What makes her a character</h3>\n<ul>\n<li><strong>What she feels isn't what she shows.</strong> Display rules decide how much of each feeling reaches her face. Some she shows fully, others she masks, and the masks slip.</li>\n<li><strong>The secret.</strong> Reminders of what she is raise a threat and drain her composure, and she reaches for a coping move. Doubt is the slow part that lingers after.</li>\n<li><strong>A life between messages.</strong> Silence builds boredom and loneliness until she starts something herself. Feelings fade, thoughts come, and she keeps a record of each person: liking, familiarity, threat.</li>\n<li><strong>She hears herself.</strong> A self-check reads each of her own lines, so she notices a joke left waiting for its laugh, or feels guilty after a snap. When the voice skips a laugh she was meant to make, her mind notices the glitch too.</li>\n</ul>\n<h3>Keeping it honest and testable</h3>\n<ul>\n<li><strong>Hard limits in code, not in a prompt.</strong> A guard checks every sentence before it is spoken: she never claims to be human or talks about how she works. Someone who sincerely needs the truth gets a fixed honest answer, and real distress in chat switches her into a no-jokes crisis mode.</li>\n<li><strong>Replayable.</strong> Every chance roll is seeded, so a logged stream can be replayed with different personality numbers and no LLM calls, to see exactly what a tuning change does.</li>\n<li><strong>Behavioural tests.</strong> 26 scripted chat scenarios (trolls, compliments, horror stories, a long quiet night) run through her mind and the real LLMs on a simulated clock, with hard checks on every reply, plus a 94-message test set for the appraiser's readings.</li>\n</ul>\n<h3>Notes</h3>\n<ul>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Eileen\">github.com/zerobitfulladder/Eileen</a></li>\n<li><strong>Size:</strong> about 11,500 lines of Python for the brain and 5,900 of GDScript for the body.</li>\n<li><strong>Stack:</strong> Python, DeepSeek, Chatterbox Turbo (TTS), wav2vec2 phoneme recognition, WebSocket, Godot 4.7, VRM.</li>\n<li><strong>Status:</strong> a working prototype, October 2026.</li>\n</ul>", "date": "2026-10-03", "reading": 3, "summary": "An AI streamer whose feelings are numbers, not prompts. One LLM reads each chat message for what it means to her, plain code turns that into feelings that rise and fade, a second LLM writes her line without being told what she feels, and a 3D body plays it out.", "tags": ["Python", "LLM Agents", "Affective Computing", "Godot", "Speech", "VRM"], "v": "4.2 KB", "modified": "2026-10-03", "group": "Highlight", "bright": true}, {"id": "indigoshell", "path": "work/indigoshell", "name": "INDIGOSHELL", "ext": ".md", "src": "content/work/indigoshell.md", "html": "<p>indigoshell is the desktop shell I use every day: the bar along the bottom of the screen, its pop-up panels, keyboard chord menus, an app launcher, notification toasts and the system tray. My machine runs a bare tiling window manager (qtile on Xorg) with no desktop environment, so nothing else was going to provide these pieces. It is one Python process, with no GUI toolkit at all.</p>\n<p><img class=\"docimg img-center\" alt=\"indigoshell on qtile: the bar playing a song with its lyrics, the hardware panel open, a music player top left\" src=\"/static/media/indigoshell-hero.png\" width=\"1600\" height=\"900\" /></p>\n<p>The tour below was performed entirely by synthetic input, recorded at 1440p60 and cut by script. Its closing reel is the bar's own widget classes rendered on the GPU at several times their size, cut to the song's beats.</p>\n<div class=\"yt\"><iframe src=\"https://www.youtube-nocookie.com/embed/k2VP-eW4FqI\" title=\"indigoshell on qtile: the full tour\" loading=\"lazy\" allow=\"encrypted-media; picture-in-picture; fullscreen\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe></div>\n\n<h3>What it does</h3>\n<ul>\n<li><strong>The bar</strong> reserves its own screen space and is built from a declarative widget tree. Its widgets are plain at rest and animate when something happens: workspaces, lyrics that glitch in on every line, CPU, RAM and temperature meters, network activity, the current song over a beat-reactive visualiser, volume, and a clock with a battery underline.</li>\n</ul>\n<p><img class=\"docimg img-center\" alt=\"\" src=\"/static/media/indigoshell-bar.png\" width=\"1292\" height=\"102\" /></p>\n<p><img class=\"docimg img-small\" alt=\"Now playing over a cava visualiser\" src=\"/static/media/indigoshell-widget-media.gif\" width=\"778\" height=\"144\" /></p>\n<p><img class=\"docimg img-small\" alt=\"Lyrics arriving line by line\" src=\"/static/media/indigoshell-widget-lyrics.gif\" width=\"780\" height=\"144\" /></p>\n<p><img class=\"docimg img-small\" alt=\"CPU, RAM and temperature meters\" src=\"/static/media/indigoshell-widget-meters.gif\" width=\"726\" height=\"144\" /></p>\n<p><img class=\"docimg img-small\" alt=\"Network throughput\" src=\"/static/media/indigoshell-widget-network.gif\" width=\"400\" height=\"204\" /></p>\n<p><img class=\"docimg img-small\" alt=\"Workspaces, one ringing urgent\" src=\"/static/media/indigoshell-widget-workspaces.gif\" width=\"860\" height=\"204\" /></p>\n<p><img class=\"docimg img-small\" alt=\"Clock with its battery underline\" src=\"/static/media/indigoshell-widget-battery.gif\" width=\"596\" height=\"170\" /></p>\n<ul>\n<li><strong>Panels</strong> for the system, hardware (CPU and RAM history, live GPU readouts) and network (interfaces, wifi, firewall, a streamed speed test). They stay alive between opens, so a keybind shows one instantly.</li>\n</ul>\n<p><img class=\"docimg img-center\" alt=\"The hardware, network and system panels\" src=\"/static/media/indigoshell-panels.png\" width=\"1925\" height=\"639\" /></p>\n<ul>\n<li><strong>Chord menus</strong> for power, display, layout, profile, audio and graphics: a keybind opens a stack of chips, a digit picks. An action that returns another menu becomes the next step, so a multi-step flow is just functions returning menus.</li>\n<li><strong>A launcher</strong> that replaced rofi: every installed app with its icon, fuzzy matching, and history that lifts the apps you actually use. Keys typed while it opens are kept, and apps start in their own systemd scope, so reloading the shell never takes them down.</li>\n</ul>\n<p><img class=\"docimg img-small\" alt=\"A chord menu\" src=\"/static/media/indigoshell-menu.gif\" width=\"440\" height=\"296\" /></p>\n<p><img class=\"docimg img-small\" alt=\"The launcher\" src=\"/static/media/indigoshell-launcher.gif\" width=\"560\" height=\"458\" /></p>\n<ul>\n<li><strong>Notifications</strong> from a full freedesktop notification daemon that replaced dunst: urgency styling, images, action chips, progress meters, a border that traces the remaining time, and hover to pause.</li>\n<li><strong>A system tray</strong> speaking the StatusNotifierItem protocol, working with nm-applet, blueman, udiskie, Discord and Steam, with each app's own menu drawn as native rows.</li>\n</ul>\n<p><img class=\"docimg img-small\" alt=\"Notifications\" src=\"/static/media/indigoshell-notifications.gif\" width=\"530\" height=\"396\" /></p>\n<p><img class=\"docimg img-small\" alt=\"A panel opening with its scan-lock effect\" src=\"/static/media/indigoshell-panel-open.gif\" width=\"480\" height=\"449\" /></p>\n<h3>How it works</h3>\n<ul>\n<li><strong>XCB</strong> (through xcffib) for windows, input grabs, reserved screen space, transparent ARGB visuals and multi-monitor RandR events.</li>\n<li><strong>Skia</strong> for all drawing, with SkSL shaders for post-process effects such as the scan-lock reveal above, with its tearing and RGB split. Frames render through EGL/OpenGL when a GPU surface is available and fall back to CPU raster when it isn't.</li>\n<li><strong>D-Bus at the message level</strong> (dbus-fast) for the notification server, the tray, MPRIS media control, and application menus over dbusmenu.</li>\n<li><strong>One asyncio loop</strong> for X events, IPC, D-Bus, subprocesses and frame clocks. No GLib, no worker threads.</li>\n<li><strong>Windows are specs, not subclasses.</strong> A bar, a toast and a menu are the same type with a different layer and anchor, a vocabulary borrowed from Wayland's layer-shell. Widgets implement four methods: measure, arrange, paint and hit.</li>\n<li><strong>A control socket</strong> with a CLI, hot reload, and plugins for the chord menus.</li>\n</ul>\n<h3>Why a rewrite</h3>\n<p>The first version (May to August 2026, about 12,000 lines) was built on GTK 3, and it is the one shown below, as shared on r/unixporn in May. It worked, but GTK brought a second main loop, threads, and a rendering path that couldn't do what I wanted visually without burning CPU. I prototyped the alternatives, wrote a decision record comparing Cairo and Skia with measurements, then built version 2 next to the running version 1 and swapped it in with a single commit in September.</p>\n<video class=\"docimg img-center\" src=\"/static/media/indigoshell.mp4\" autoplay loop muted playsinline controls></video>\n\n<h3>Results</h3>\n<p>All measured on my laptop (i7-10870H, RTX 3060 Laptop):</p>\n<ul>\n<li><strong>Idle CPU cost fell from 25.8% of a core to 4.5%</strong> (5.7x lower), and from 27.5% to 7.6% with music playing. The bar now repaints only the rectangles that changed, and each widget sets its own frame rate. The damage-only output was checked byte for byte against full repaints over 360 frames: zero mismatches.</li>\n<li><strong>A full-panel shader effect costs 0.08 ms per frame on the GPU</strong> at full resolution, against 25 ms on the CPU even at about a third of the resolution.</li>\n<li><strong>121 draw calls per frame</strong> for the meters became 14 batched paths.</li>\n<li><strong>Beat detection</strong> for the music visualiser costs 13.4 µs per audio block, and the whole audio pipeline only runs while something is actually playing.</li>\n</ul>\n<h3>Bugs worth remembering</h3>\n<p>The interesting failures were the silent ones:</p>\n<ul>\n<li>On NVIDIA, the XCB flavour of EGL quietly hands you a software renderer. The fix was the X11 platform plus an explicit check of which renderer you actually got.</li>\n<li>Swap intervals apply per surface, so each new window could silently block the whole event loop on vsync.</li>\n<li>The window manager counted reserved screen space additively, so the gap under the bar grew with every display change.</li>\n<li>Media players can exit without ever announcing it over MPRIS. The fix watches the bus for the player's name disappearing.</li>\n</ul>\n<h3>Notes</h3>\n<ul>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/indigoshell\">github.com/zerobitfulladder/indigoshell</a>, open source, 13 stars.</li>\n<li><strong>Stack:</strong> Python 3.14, xcffib, skia-python, EGL/GL through ctypes, dbus-fast, asyncio; cava and aubio for the audio visualiser.</li>\n<li><strong>Status:</strong> daily driver since May 2026. The API still moves.</li>\n</ul>", "date": "2026-10-03", "reading": 4, "summary": "A desktop shell for X11 in one Python process. Bar, panels, chord menus, app launcher, notification daemon and system tray, drawn with Skia on the GPU from a single asyncio loop. Open source, and my daily driver.", "tags": ["Python", "X11", "Skia", "OpenGL", "D-Bus", "Linux", "Desktop Shell"], "v": "6.9 KB", "modified": "2026-10-03", "group": "Highlight", "bright": true}, {"id": "viturebd", "path": "work/viturebd", "name": "VITUREBD", "ext": ".md", "src": "content/work/viturebd.md", "html": "<p>XR glasses like the VITURE Luma Ultra show your desktop as a big flat screen floating in front of you. VitureBD makes that screen three-dimensional, live: every frame of the desktop gets a depth estimate, and the image is warped into separate views for each eye, so ordinary windows, videos and games appear with depth.</p>\n<h3>How it works</h3>\n<ol>\n<li><strong>Capture.</strong> A small C++ library uses XComposite and GLX texture-from-pixmap to read the desktop as GPU textures, window by window, and shares them with the Python renderer through a C interface without copying. Capturing window pixmaps instead of the screen means the overlay never captures itself.</li>\n<li><strong>Depth.</strong> Depth Anything V2 Small estimates depth for every frame. Exported from PyTorch to ONNX and built into a TensorRT FP16 engine, it runs at about 120 fps, against about 67 fps in PyTorch. CUDA-OpenGL interop hands each frame to the network without a round trip through the CPU.</li>\n<li><strong>Stereo.</strong> A GLSL mesh warp (depth-image-based rendering) shifts every pixel by its depth to produce the two eye views. It tears the mesh at depth edges so foreground objects separate from the background, fills the holes this opens, and refines edges by joint-bilateral upsampling at full output resolution.</li>\n<li><strong>Presentation.</strong> The stereo pair goes side by side to the glasses' display. The desktop itself is rendered on a separate display head, so a fullscreen window can never cover the overlay.</li>\n</ol>\n<p>Everything is tuned live from a settings panel drawn inside the glasses: the display mode and supersampling, the depth model and TensorRT, 3D strength and how far the scene floats, mesh tearing, and the edge refinement. Rendered here from the real menu code and my saved settings:</p>\n<p><img class=\"docimg img-center\" alt=\"The settings panel: display, depth, 3D and refine tabs\" src=\"/static/media/viturebd-panel.png\" width=\"1280\" height=\"872\" /></p>\n<h3>The frame budget</h3>\n<p>At 60 fps a frame has 16.7 ms, and missing it by a fraction drops the display to 30 fps, so the work was about margin rather than raw speed. A per-stage profiler showed:\n- depth at about 9.6 ms (8 ms of inference plus 1.6 ms of interop);\n- presentation at 5.7 ms;\n- the CPU at 1 ms.</p>\n<p>That is 16.5 ms in total, right on the line. Two changes fixed it:\n- the warp mesh was sampling the depth map about three times finer than the map carries information;\n- the warp always ran through a geometry shader that only edge tearing needs.</p>\n<p>Warp cost fell from 4.63 ms to 0.86 ms, for a <strong>stable 60 fps with about 3.5 ms to spare</strong>.</p>\n<p>An asynchronous mode that runs depth on a worker thread reaches 60 fps easily, but colour and depth then drift apart during motion and leave smears, so the synchronous path stayed the default.</p>\n<p>Before the depth work, a fork of VITURE's SDK demo became a head-tracked virtual desktop: a screen locked in place in 6DoF, fed by a small built-in compositor.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Hardware:</strong> VITURE Luma Ultra; a laptop with an RTX 3060 Laptop GPU (6 GB).</li>\n<li><strong>Stack:</strong> C++17 (Xlib, XComposite, GLX), Python, moderngl, GLSL, PyTorch, ONNX, TensorRT, cuda-python, raylib.</li>\n<li><strong>Size:</strong> about 3,100 lines of Python and 280 of C++, plus my changes to the vendor demo.</li>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/VitureBD\">github.com/zerobitfulladder/VitureBD</a>, without VITURE's SDK, which is not redistributable.</li>\n<li><strong>Status:</strong> works on my glasses and driver setup; not packaged for anyone else.</li>\n</ul>", "date": "2026-06-25", "reading": 3, "summary": "Live 2D-to-3D for the whole Linux desktop on VITURE Luma Ultra glasses. Window capture, monocular depth on TensorRT and a GPU mesh warp into a stereo pair, at a stable 60 fps on a laptop GPU.", "tags": ["Python", "C++", "OpenGL", "GLSL", "TensorRT", "CUDA", "Depth Anything V2", "X11", "XR"], "v": "3.6 KB", "modified": "2026-06-25", "group": "Highlight", "bright": true}, {"id": "viture-ar", "path": "work/viture-ar", "name": "MONITOR-ANCHORED AR ON VITURE GLASSES", "ext": ".md", "src": "content/work/viture-ar.md", "html": "<p>The VITURE Luma Ultra has cameras and a head tracker, but on Linux nothing made use of them. Over three days I brought the sensors up through the vendor's SDK and built world-locked AR on top: virtual objects that stay pinned to a real desktop monitor while you move your head, to within one or two centimetres.</p>\n<h3>Bringing up the hardware</h3>\n<ul>\n<li><strong>The right SDK:</strong> the documented SDK turned out to be 3DoF-only. This model needs SDK v2, which runs visual-inertial odometry on the host. A C++ probe and a Python bridge read head pose at about 25 Hz, the IMU at about 1 kHz, and both tracking cameras.</li>\n<li><strong>Three undocumented failures, each found and fixed:</strong></li>\n<li>a pose call that writes more values than documented and corrupts the heap;</li>\n<li>a second SDK instance crashing the closed tracking library (now prevented with an exclusive lock);</li>\n<li>the glasses' USB hub dropping the whole device after a failed power-saving resume (fixed with udev rules).</li>\n<li><strong>Calibration data:</strong> extracted the unit's factory calibration, and implemented the camera distortion model that OpenCV lacks.</li>\n</ul>\n<h3>Anchoring to the monitor</h3>\n<ul>\n<li><strong>Markers:</strong> AprilTag and ArUco markers are drawn on the monitor itself as click-through windows. The headset's pose comes from planar PnP (IPPE).</li>\n<li><strong>Calibration:</strong> hand-eye calibration (Tsai) between the head tracker and the RGB camera, then SPAAM per-eye display calibration. You line up crosshairs with real points, and the solver recovers where each eye sits relative to the camera. The solved eye separation came out at 6.37 cm, a plausible human value and a good sign the geometry was right.</li>\n<li><strong>Result:</strong> virtual content registered to the real monitor within <strong>1 to 2 cm</strong>.</li>\n<li><strong>Smoothness:</strong> OneEuro filtering on head pose. A visible judder turned out to be two displays beating against each other at 59.95 Hz and 60.00 Hz; it was fixed by syncing rendering to the glasses' output.</li>\n</ul>\n<h3>Blender live link</h3>\n<p>A Blender add-on streams meshes, materials and the camera over a small TCP protocol to my own stereo glTF renderer. A scene edited in Blender appears in the glasses, anchored to the desk, while you work on it.</p>\n<h3>What didn't work</h3>\n<p>The project started as a proximity-sensing glove for blind users: the glasses would measure how far the hand is from nearby surfaces and drive vibration motors. Three world-model designs failed the 20 to 25 cm reliability bar: volumetric fusion from stereo, the same from metric monocular depth, and a sparse landmark map. A single-frame design anchored to the hand did work, giving 3.3 cm readings and driving phone vibration as a stand-in. But no glove was built, and I shelved the idea.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Hardware:</strong> VITURE Luma Ultra (stereo tracking cameras, RGB camera, IMU), a 1440p monitor, an RTX 3060 Laptop GPU.</li>\n<li><strong>Stack:</strong> C++17 (VITURE SDK v2), Python, OpenCV contrib, moderngl, pyglet, the Blender Python API, udev.</li>\n<li><strong>Size:</strong> about 2,600 lines of Python, a 550-line Blender add-on and a small C++ bridge.</li>\n<li><strong>Status:</strong> working prototype from August 2026; source not published.</li>\n</ul>", "date": "2026-08-22", "reading": 2, "summary": "World-locked AR on VITURE Luma Ultra glasses under Linux, anchored to a desktop monitor. Closed-SDK bring-up, marker tracking, hand-eye and per-eye display calibration down to 1 to 2 cm, and a live link that streams Blender scenes into the glasses.", "tags": ["Python", "C++", "OpenCV", "Computer Vision", "Calibration", "AR", "OpenGL", "Blender"], "v": "3.4 KB", "modified": "2026-08-22", "group": "Highlight", "bright": true}, {"id": "info-screen", "path": "work/info-screen", "name": "RASPBERRY PI INFORMATION DISPLAY", "ext": ".md", "src": "content/work/info-screen.md", "html": "<p>A client wanted one screen at home that showed everything at a glance: weather from their own station, the water chemistry of their pool, energy use, the date and time, and a live camera feed. It runs on a Samsung Frame TV mounted vertically, driven by a Raspberry Pi, and has to keep running day and night without anyone touching it.</p>\n<p><img class=\"docimg img-center\" alt=\"The display, light theme\" src=\"/static/media/info-screen-light.png\" width=\"1880\" height=\"957\" /></p>\n<h3>How it works</h3>\n<ul>\n<li><strong>One backend for every source.</strong> A Flask service with one module per device (an Ecowitt weather station, a Blue Riiot pool analyser, a HomeWizard energy meter) polls their APIs and serves a single combined feed to the page.</li>\n<li><strong>The camera.</strong> Browsers can't play RTSP, so ffmpeg turns the stream into a sequence of JPEG frames that the page shows in place.</li>\n<li><strong>The page.</strong> First prototyped in Svelte, then rewritten in plain jQuery to keep the moving parts and the load on the Pi down. A dark theme switches on and off with local sunrise and sunset.</li>\n<li><strong>Configuration and install.</strong> Data sources, units, the stream URL and credentials live in one config file. Install and uninstall scripts set everything up, including menu entries.</li>\n<li><strong>Running 24/7.</strong> Long unattended runs exposed a memory leak and the need for automatic refreshes, both handled before handover.</li>\n</ul>\n<p><img class=\"docimg img-center\" alt=\"The display, dark theme\" src=\"/static/media/info-screen-dark.png\" width=\"540\" height=\"950\" /></p>\n<h3>Client feedback</h3>\n<blockquote>\n<p>From the onset, Tuğrul demonstrated a high level of proficiency and commitment to the project. He was responsible for developing and implementing software to display information on a physical screen using a Raspberry Pi computer. His tasks included working with webcams and APIs to gather and display real-time data on a Samsung iFrame set up in a vertical layout.</p>\n<p>Throughout the project, Tuğrul showcased not only strong technical skills but also excellent collaboration and communication abilities. He was consistently proactive in troubleshooting issues and took the time to collaborate with stakeholders to ensure the project requirements were met effectively and efficiently.</p>\n<p>What impressed me the most was Tuğrul's ability to deliver quality work within the stipulated timeframe. His skill in API integration and real-time data display was evident as the project came together smoothly and met all the predetermined requirements.</p>\n<p>I am extremely satisfied with the work Tuğrul has done and can vouch for his technical skills, work ethic, and professional attitude. I would not hesitate to engage him in future projects and highly recommend him for any endeavors he chooses to pursue.</p>\n<p>Upwork client, ★★★★★</p>\n</blockquote>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> Upwork, April to September 2023, about a hundred commits over five months.</li>\n<li><strong>Stack:</strong> Python, Flask, jQuery, ffmpeg, Bash, Raspberry Pi OS.</li>\n</ul>", "date": "2023-09-05", "reading": 2, "summary": "A wall-mounted information display for a client in Sweden. Weather station, pool sensor and energy meter readings plus a live camera feed on a vertical TV, running unattended on a Raspberry Pi.", "tags": ["Raspberry Pi", "Python", "Flask", "jQuery", "RTSP", "ffmpeg", "IoT"], "v": "3.1 KB", "modified": "2023-09-05", "group": "Contracts"}, {"id": "linux-call-recorder", "path": "work/linux-call-recorder", "name": "LINUX PHONE CALL RECORDER", "ext": ".md", "src": "content/work/linux-call-recorder.md", "html": "<p>Linux phones such as the Librem 5 and PinePhone lack features that Android and iOS users take for granted, and call recording was one of them. A client needed it as a set-and-forget background service, so I built PCMin: a daemon that notices when a call starts and records both sides of the conversation until it ends.</p>\n<h3>How it works</h3>\n<ul>\n<li><strong>Call events over D-Bus.</strong> The daemon listens to ModemManager's call-state signals on the system bus. When a call becomes active, recording starts; when it ends, the files are saved with a timestamp, the direction (incoming or outgoing) and the caller's number.</li>\n<li><strong>Both sides, separately.</strong> PulseAudio provides two sources at once: the microphone, and the monitor of the speaker output. Each is recorded to its own WAV file, which keeps quality up and leaves room for post-processing.</li>\n<li><strong>GStreamer pipelines</strong> handle the encoding, one per channel, writing to temporary files that only move to permanent storage when the call ends.</li>\n<li><strong>Event-driven.</strong> A GLib main loop with D-Bus signal handlers, no polling, so the phone's battery and CPU are left alone between calls.</li>\n</ul>\n<h3>What was tricky</h3>\n<ul>\n<li><strong>Audio devices move.</strong> PulseAudio source names change between calls, for example when switching between earpiece and speakerphone, so the daemon re-resolves its sources before every recording.</li>\n<li><strong>Sparse documentation.</strong> How cellular calls surface to userspace on Linux had to be pieced together from ModemManager's D-Bus API, PulseAudio internals and scattered community sources.</li>\n</ul>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> Upwork, October 2023, built for the Librem 5 and usable on any Linux phone running ModemManager and PulseAudio.</li>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Linux-Phone-Call-Recorder\">github.com/zerobitfulladder/Linux-Phone-Call-Recorder</a></li>\n<li><strong>Stack:</strong> Python, D-Bus, ModemManager, PulseAudio, GStreamer, GLib.</li>\n</ul>", "date": "2023-10-06", "reading": 1, "summary": "An automatic call-recording daemon for Linux phones like the Librem 5, wired into ModemManager over D-Bus and recording both sides of a call through PulseAudio and GStreamer.", "tags": ["Linux", "Python", "D-Bus", "PulseAudio", "GStreamer", "ModemManager"], "v": "2.1 KB", "modified": "2023-10-06", "group": "Contracts"}, {"id": "astrophysics-website", "path": "work/astrophysics-website", "name": "ASTROPHYSICS DATA PLATFORM", "ext": ".md", "src": "content/work/astrophysics-website.md", "html": "<p>The magnetar research group at my university ran a two-server system. One server gathered observation data from NASA's Fermi Gamma-ray Burst Monitor (GBM) and ran the calculations that flag candidate events; the other published the results for the researchers to search. Moving data between the two was manual, the results had no proper database behind them, and the interface made searching slow.</p>\n<p><img class=\"docimg img-right\" alt=\"Search results\" src=\"/static/media/astro-data-display.png\" width=\"1325\" height=\"1226\" /></p>\n<h3>What I built</h3>\n<ul>\n<li><strong>Automated transfer.</strong> Python utilities move observation files between the servers over FTPS and run unattended, replacing the manual copying step.</li>\n<li><strong>Parsing and storage.</strong> A parser turns the FITS files astronomers work with into structured records, and a MySQL layer (in PHP, to fit the existing server) stores and queries them.</li>\n<li><strong>A new interface.</strong> A React and TypeScript site with Material UI for searching and browsing the results, replacing the old pages. It is <a href=\"https://magnetars.sabanciuniv.edu/gbm/\">live on the university's servers</a>.</li>\n</ul>\n<p><img class=\"docimg img-left\" alt=\"The search interface\" src=\"/static/media/astro-search.png\" width=\"1372\" height=\"1112\" /></p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> research-group project at Sabancı University, August to November 2022.</li>\n<li><strong>Source:</strong> the <a href=\"https://github.com/zerobitfulladder/Magnetars-Display-Page\">interface</a> is public; the server utilities are private.</li>\n<li><strong>Stack:</strong> Python, Bash, PHP, MySQL, React, TypeScript, Material UI, FITS.</li>\n</ul>", "date": "2022-10-07", "reading": 1, "summary": "Data plumbing and a new search site for a university research group studying magnetars. Automated transfer of NASA observation data between servers, a database for the results, and a modern interface to search them.", "tags": ["Python", "PHP", "MySQL", "React", "TypeScript", "Material UI", "Bash"], "v": "1.7 KB", "modified": "2022-10-07", "group": "Contracts"}, {"id": "rhino-matlab-bridge", "path": "work/rhino-matlab-bridge", "name": "RHINO-MATLAB BRIDGE", "ext": ".md", "src": "content/work/rhino-matlab-bridge.md", "html": "<p>An architecture researcher at Istanbul Technical University was modelling how people perceive design principles on building façades, using fuzzy-logic systems in MATLAB, while the façade designs lived in Rhino and Grasshopper. The research needed the two to work together, and they had no way to talk to each other.</p>\n<p><img class=\"docimg img-center\" alt=\"\" src=\"/static/media/rhino.png\" width=\"669\" height=\"320\" /></p>\n<h3>How it works</h3>\n<ul>\n<li><strong>A Grasshopper-facing server.</strong> A small Flask service speaks Grasshopper's Hops protocol, so the bridge appears inside Grasshopper as ordinary components.</li>\n<li><strong>MATLAB in the loop.</strong> The service starts the MATLAB engine from Python, loads the research group's fuzzy-logic models, and runs them on whatever the Grasshopper definition sends.</li>\n<li><strong>Components generated, not hand-written.</strong> For every fuzzy-logic model file it finds, the bridge builds a matching Grasshopper component at runtime, with the right number of inputs. Adding a model to the folder adds a component, without touching the code.</li>\n</ul>\n<p>I had not used Rhino, Grasshopper or MATLAB before this project, so it started with learning all three well enough to connect them.</p>\n<h3>Outcome</h3>\n<p>The bridge was used in the research, and I am thanked in the acknowledgements of the published paper: Çekmiş, <em>Modelling the perception of visual design principles on façades through fuzzy sets: towards building an automated architectural data generation and labelling tool</em>, <a href=\"https://www.tandfonline.com/doi/full/10.1080/00038628.2023.2269549#:~:text=Tu%C4%9Frul%20Agrikli\">Architectural Science Review 67(4), 2023</a>.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> academic collaboration, February 2022.</li>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Grasshopper-Matlab-Communication\">github.com/zerobitfulladder/Grasshopper-Matlab-Communication</a></li>\n<li><strong>Stack:</strong> Python, Flask, Grasshopper Hops, MATLAB Engine for Python, MATLAB Fuzzy Logic Toolbox.</li>\n</ul>", "date": "2022-02-22", "reading": 1, "summary": "A bridge that lets Rhino and Grasshopper call MATLAB fuzzy-logic models live, built for an architecture research project at Istanbul Technical University and acknowledged in the resulting journal paper.", "tags": ["Python", "Flask", "MATLAB", "Rhino", "Grasshopper", "Fuzzy Logic"], "v": "2.1 KB", "modified": "2022-02-22", "group": "Contracts"}, {"id": "tapu-extractor", "path": "work/tapu-extractor", "name": "LAND REGISTRY PDF EXTRACTOR", "ext": ".md", "src": "content/work/tapu-extractor.md", "html": "<p>Turkish land-registry documents (tapu) come as PDFs full of tables: where a property is, its block and parcel, and any liens or enforcement proceedings registered against it. Getting that into a spreadsheet meant copying it out by hand, document by document, through watermarks.</p>\n<h3>How it works</h3>\n<ul>\n<li><strong>Upload in bulk.</strong> Many PDFs at once, through a simple web interface (in Turkish, built with Bootstrap 5).</li>\n<li><strong>Clean, then extract.</strong> PyMuPDF removes the watermarks, and Camelot extracts the tables.</li>\n<li><strong>Turkish text, done properly.</strong> Names and places are normalised with ICU. Turkish has a dotted and a dotless i, so naive case conversion silently corrupts words.</li>\n<li><strong>Fields.</strong> It pulls the property ID, province, district and neighbourhood; block, parcel, floor and unit; lien types and descriptions; the enforcement office, file numbers, dates and journal numbers.</li>\n<li><strong>Output</strong> is an Excel or CSV file, ready to sort and filter.</li>\n<li><strong>Delivery.</strong> Packaged with uv and Windows setup scripts, so it installs on an ordinary office PC.</li>\n</ul>\n<h3>Notes</h3>\n<ul>\n<li><strong>Context:</strong> built for a client who downloads these documents in bulk and needs the data in Excel to prepare documents automatically.</li>\n<li><strong>Source:</strong> <a href=\"https://github.com/zerobitfulladder/Webtapu-Extractor-App\">github.com/zerobitfulladder/Webtapu-Extractor-App</a></li>\n<li><strong>Stack:</strong> Python, Flask, Camelot, PyMuPDF, PyICU, pandas, Bootstrap 5.</li>\n</ul>", "date": "2025-10-17", "reading": 1, "summary": "A web app that turns batches of Turkish land-registry (tapu) PDFs into clean spreadsheets, with table extraction, watermark removal and correct handling of Turkish text.", "tags": ["Python", "Flask", "PDF Extraction", "Camelot", "PyMuPDF", "Data Processing"], "v": "1.7 KB", "modified": "2025-10-17", "group": "Contracts"}, {"id": "email-automation", "path": "work/email-automation", "name": "EMAIL PDF EXTRACTION AUTOMATION", "ext": ".md", "src": "content/work/email-automation.md", "html": "<p>A client received about 20,000 emails a week. Each one carried a password-protected ZIP file with a PDF inside, and the password for each ZIP arrived in a separate email. They needed every PDF extracted and filed, with none missed, and no one doing it by hand.</p>\n<h3>How it works</h3>\n<ul>\n<li><strong>Pairing.</strong> A Python service reads the mailbox through the Gmail API and matches every password email to the attachment it unlocks.</li>\n<li><strong>Extraction.</strong> It opens each protected ZIP, extracts the PDF, and files it in a predictable structure on the client's remote desktop.</li>\n<li><strong>Nothing silently lost.</strong> Error handling was built around one requirement: a complete set of documents, with no PDF missed.</li>\n</ul>\n<p>This was my first project where volume really mattered, and it taught me to design for the failure cases first: at 20,000 messages a week, a rare problem happens every day.</p>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> client project, 2020.</li>\n<li><strong>Stack:</strong> Python, Gmail API.</li>\n</ul>", "date": "2020-05-09", "reading": 1, "summary": "Automated ingestion of about 20,000 emails a week, pairing each password email with its ZIP attachment and extracting every PDF without a miss.", "tags": ["Python", "Gmail API", "Automation", "Data Processing"], "v": "1.2 KB", "modified": "2020-05-09", "group": "Contracts"}, {"id": "mtg-arena-monitor", "path": "work/mtg-arena-monitor", "name": "MTG ARENA LOG MONITOR", "ext": ".md", "src": "content/work/mtg-arena-monitor.md", "html": "<p>A client needed a desktop app that watches Magic: The Gathering Arena's log file while a match is played and shows selected game events as they happen. The log is human-readable but undocumented, so most of the work was reading it carefully enough to know what each entry means.</p>\n<h3>What it shows</h3>\n<ul>\n<li>Match start and the deck list for the match.</li>\n<li>Cards drawn and played by the player.</li>\n<li>Cards played by the opponent.</li>\n<li>Match end and the result.</li>\n</ul>\n<h3>How it works</h3>\n<p>A Python and Tkinter app tails the log file continuously, recognises the entries that matter by their structure, and turns them into a clean running list of events, with nothing else on screen.</p>\n<h3>Client feedback</h3>\n<blockquote>\n<p>Exceptionally focused and dedicated freelancer. Hope to work in future projects.</p>\n<p>Upwork client, ★★★★★</p>\n</blockquote>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> Upwork, 2021.</li>\n<li><strong>Stack:</strong> Python, Tkinter.</li>\n</ul>", "date": "2021-03-01", "reading": 1, "summary": "A desktop app that follows the Magic: The Gathering Arena log file in real time and shows the game as it happens: deck lists, draws, plays and results.", "tags": ["Python", "Tkinter", "Log Parsing", "Desktop App"], "v": "1.1 KB", "modified": "2021-03-01", "group": "Contracts"}, {"id": "image-metadata-translator", "path": "work/image-metadata-translator", "name": "IMAGE METADATA TRANSLATOR", "ext": ".md", "src": "content/work/image-metadata-translator.md", "html": "<p>A client had folders of images whose headline, description and keywords were stored as metadata inside the files, all in one language, and needed them in another. Doing it by hand meant opening every file.</p>\n<h3>How it works</h3>\n<ul>\n<li>The user points the script at a folder and chooses the source and target languages.</li>\n<li>It reads the EXIF and IPTC fields (headline, description, keywords), translates them through the DeepL API, and writes the results back into the same files, without renaming anything.</li>\n<li>It was written to be easy for the client to run from the Terminal on their Mac, with clear documentation and error handling for the edge cases that came up along the way.</li>\n</ul>\n<h3>Client feedback</h3>\n<blockquote>\n<p>Tuğrul wrote a script in Python that integrated with a third party API to automate a manual process. His code was straightforward and well-documented. He went out of his way to resolve some unexpected issues and always delivered on time. I would be happy to work with Tuğrul again.</p>\n<p>Upwork client, ★★★★★</p>\n</blockquote>\n<h3>Notes</h3>\n<ul>\n<li><strong>Engagement:</strong> Upwork, 2021.</li>\n<li><strong>Stack:</strong> Python, DeepL API, EXIF and IPTC tooling.</li>\n</ul>", "date": "2021-05-05", "reading": 1, "summary": "A script that translates the titles, descriptions and keywords stored inside images (EXIF and IPTC) through the DeepL API, and writes them back in place.", "tags": ["Python", "DeepL API", "EXIF", "IPTC", "Automation"], "v": "1.4 KB", "modified": "2021-05-05", "group": "Contracts"}, {"id": "premiere-csv-markers", "path": "work/premiere-csv-markers", "name": "PREMIERE CSV MARKER IMPORTER", "ext": ".md", "src": "content/work/premiere-csv-markers.md", "html": "<p>A video editing client kept timestamped notes in CSV files and needed them on the Premiere Pro timeline as markers, without retyping each one.</p>\n<h3>What it does</h3>\n<ul>\n<li>Imports several CSV files at once as markers.</li>\n<li>Gives the
